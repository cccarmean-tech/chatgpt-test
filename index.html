<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Test Lab</title>
  <style>
    :root { color-scheme: dark; --bg:#10131d; --panel:#1b2130; --text:#f4f6ff; --accent:#8b7cff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top,#25234a,var(--bg) 55%); color:var(--text); font-family:system-ui,sans-serif; transition:background .25s; }
    main { width:min(100%,560px); padding:32px; border:1px solid #ffffff20; border-radius:24px; background:var(--panel); box-shadow:0 24px 80px #0006; text-align:center; }
    .tag { color:var(--accent); font-size:.78rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:12px 0 8px; font-size:clamp(2rem,7vw,3.2rem); }
    p { color:#b9c0d3; line-height:1.6; }
    .count { margin:28px 0 8px; font-size:4rem; font-weight:800; font-variant-numeric:tabular-nums; }
    .message { min-height:52px; margin:12px 0 24px; }
    .buttons { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
    button { border:0; border-radius:12px; padding:12px 17px; color:white; background:var(--accent); font:inherit; font-weight:700; cursor:pointer; }
    button.secondary { background:#343c50; }
    button:hover { filter:brightness(1.12); transform:translateY(-1px); }
    button:focus-visible { outline:3px solid white; outline-offset:3px; }
    footer { margin-top:26px; color:#7f899f; font-size:.8rem; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Experiment 001</div>
    <h1>ChatGPT Test Lab</h1>
    <p>A tiny corner of the internet for testing buttons, counters, and questionable ideas.</p>
    <div class="count" id="count" aria-live="polite">0</div>
    <p>Button clicks recorded</p>
    <div class="message" id="message" aria-live="polite">System ready. Press a button to begin.</div>
    <div class="buttons">
      <button id="clickBtn">Click me</button>
      <button class="secondary" id="randomBtn">Random message</button>
      <button class="secondary" id="themeBtn">Change theme</button>
      <button class="secondary" id="resetBtn">Reset</button>
    </div>
    <footer>Built for experiments · Nothing important is being stored</footer>
  </main>
  <script>
    let clicks = 0;
    let theme = 0;
    const messages = [
      "The button has successfully been buttoned.",
      "Scientists are currently investigating this click.",
      "Test result: absolutely magnificent.",
      "A tiny computer somewhere is proud of you.",
      "You have officially disturbed the counter.",
      "Everything is working. Probably.",
      "This is what peak website technology looks like."
    ];
    const themes = [
      ["#10131d", "#1b2130", "#8b7cff"],
      ["#10201c", "#1b3029", "#4ac59a"],
      ["#21151b", "#34212b", "#ff789d"],
      ["#171d29", "#26364a", "#55b8ed"]
    ];
    const count = document.getElementById("count");
    const message = document.getElementById("message");
    document.getElementById("clickBtn").addEventListener("click", () => {
      clicks++;
      count.textContent = clicks;
      message.textContent = "Click registered. The experiment continues.";
    });
    document.getElementById("randomBtn").addEventListener("click", () => {
      message.textContent = messages[Math.floor(Math.random() * messages.length)];
    });
    document.getElementById("themeBtn").addEventListener("click", () => {
      theme = (theme + 1) % themes.length;
      document.documentElement.style.setProperty("--bg", themes[theme][0]);
      document.documentElement.style.setProperty("--panel", themes[theme][1]);
      document.documentElement.style.setProperty("--accent", themes[theme][2]);
      message.textContent = "New theme loaded.";
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      clicks = 0;
      count.textContent = clicks;
      message.textContent = "Counter reset. Fresh experiment!";
    });
  </script>
</body>
</html>
